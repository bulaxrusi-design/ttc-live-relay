name: Export current device frame

on:
  push:
    branches: [main]
    paths:
      - "ops/export-frame-trigger.txt"

permissions:
  contents: write

jobs:
  export-frame:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout control repository
        uses: actions/checkout@v4
        with:
          ref: main
          path: main-repo

      - name: Checkout latest device frame
        uses: actions/checkout@v4
        with:
          ref: device-frames
          path: frames
          persist-credentials: false

      - name: Decode private frame artifact
        run: |
          python3 - <<'PY'
          import base64
          import json
          from pathlib import Path

          source = Path("frames/state/current_frame.json")
          data = json.loads(source.read_text(encoding="utf-8"))
          if data.get("redacted"):
              raise SystemExit("Latest frame is redacted")
          encoded = data.get("jpeg_base64")
          if not encoded:
              raise SystemExit("Latest frame has no jpeg_base64")

          output = Path("export")
          output.mkdir(parents=True, exist_ok=True)
          (output / "current-frame.jpg").write_bytes(base64.b64decode(encoded))
          metadata = {key: value for key, value in data.items() if key != "jpeg_base64"}
          (output / "current-frame.json").write_text(
              json.dumps(metadata, indent=2), encoding="utf-8"
          )
          PY

      - name: Upload private frame artifact
        uses: actions/upload-artifact@v4
        with:
          name: device-frame-${{ github.run_id }}
          path: export/
          retention-days: 1

      - name: Publish export run ID
        working-directory: main-repo
        run: |
          mkdir -p ops
          printf '%s\n' "$GITHUB_RUN_ID" > ops/latest-frame-export-run.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ops/latest-frame-export-run.txt
          if git diff --cached --quiet; then
            echo "Run ID unchanged"
          else
            git commit -m "Record latest private frame export [skip ci]"
            git push
          fi
