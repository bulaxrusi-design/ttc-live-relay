name: Device Lab Live v3

on:
  workflow_dispatch:
  push:
    branches: [device-lab-live-v3]
    paths:
      - "android-agent/**"
      - "server/**"
      - "plugins/device-lab-live/**"
      - ".github/workflows/device-lab-live-v3.yml"
  pull_request:
    paths:
      - "android-agent/**"
      - "server/**"
      - "plugins/device-lab-live/**"

permissions:
  contents: read

jobs:
  server:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run check

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - run: gradle -p android-agent :app:lintDebug :app:testDebugUnitTest :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: device-lab-live-v3-debug-apk
          path: android-agent/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
