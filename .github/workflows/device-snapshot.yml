name: Device Snapshot

on:
  push:
    paths:
      - "vision/request.txt"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare snapshot
        run: |
          mkdir -p snapshot
          cp state/current.jpg snapshot/current.jpg
          cp state/status.json snapshot/status.json
          if command -v tesseract >/dev/null 2>&1; then
            tesseract state/current.jpg snapshot/ocr --psm 11 tsv || true
            tesseract state/current.jpg snapshot/ocr-text --psm 11 || true
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: device-snapshot-${{ github.run_id }}
          path: snapshot/
          if-no-files-found: error
          retention-days: 1
